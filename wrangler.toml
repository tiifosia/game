# Cloudflare Workers 설정
name = "mbti-class-game"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "none"
# 모든 요청을 워커가 먼저 받아, 허용한 페이지와 파일만 내보낸다
run_worker_first = true

[[durable_objects.bindings]]
name = "GAME"
class_name = "GameRoom"

# 무료 플랜은 SQLite 기반 Durable Object를 쓴다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
